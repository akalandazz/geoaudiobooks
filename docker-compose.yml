services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geoaudiobooks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/geoaudiobooks
      SECRET_KEY: changeme-use-a-long-random-string-in-production
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: audiobooks
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_KEY: changeme-internal-key
    depends_on:
      - db
      - minio
      - redis
    volumes:
      - ./backend:/app

  worker:
    build: ./backend
    command: celery -A app.celery_app.celery worker --loglevel=info
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/geoaudiobooks
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: audiobooks
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - db
      - redis
    volumes:
      - ./backend:/app

  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

  booksmanager:
    build: ./booksmanager
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/geoaudiobooks
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: audiobooks
      BACKEND_URL: http://backend:8000
      INTERNAL_API_KEY: changeme-internal-key
    depends_on:
      - db
      - minio
      - backend
    volumes:
      - ./:/workspace
    working_dir: /workspace
    stdin_open: true
    tty: true
    profiles:
      - tools

  e2e:
    build: ./e2e
    command: npx playwright test --reporter=line
    network_mode: host
    environment:
      BASE_URL: http://localhost:3000
      BACKEND_URL: http://localhost:8000
    depends_on:
      - frontend
      - backend
    profiles:
      - e2e

volumes:
  pgdata:
  miniodata:

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: geoaudiobooks
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/geoaudiobooks
      SECRET_KEY: changeme-use-a-long-random-string-in-production
    depends_on:
      - db
    volumes:
      - ./backend:/app

volumes:
  pgdata:
